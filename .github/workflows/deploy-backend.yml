name: Deploy backend to Cloud Run

on:
  push:
    branches: [main]
    paths: ["backend/**", ".github/workflows/deploy-backend.yml"]
  workflow_dispatch: # manual "Run workflow" button

permissions:
  contents: read
  id-token: write # lets GitHub issue an OIDC token that Google trusts (no stored key)

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.DEPLOY_SA }}

      - id: deploy
        uses: google-github-actions/deploy-cloudrun@v3
        with:
          service: cloud-agent-backend
          region: ${{ vars.GCP_REGION }}
          source: backend # Cloud Build builds backend/Dockerfile
          # Quoted so the comma-separated origin list stays one value.
          env_vars: |-
            ALLOWED_ORIGINS="${{ vars.ALLOWED_ORIGINS }}"
          secrets: |-
            OPENAI_API_KEY=openai-api-key:latest
          flags: --allow-unauthenticated

      - run: curl -fsS "${{ steps.deploy.outputs.url }}/api/health"
