name: Deploy backend to Cloud Run

on:
  push:
    branches: [main]
    paths: ["backend/**", ".github/workflows/deploy-backend.yml"]
  workflow_dispatch: # manual "Run workflow" button

permissions:
  contents: read
  id-token: write # lets GitHub issue an OIDC token that Google trusts (no stored key)

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.DEPLOY_SA }}
          project_id: ${{ vars.GCP_PROJECT_ID }}

      - id: deploy
        uses: google-github-actions/deploy-cloudrun@v3
        with:
          service: cloud-agent-backend
          region: ${{ vars.GCP_REGION }}
          source: backend # Cloud Build builds backend/Dockerfile
          # One origin only: the action splits env_vars on commas.
          env_vars: |-
            ALLOWED_ORIGINS=${{ vars.ALLOWED_ORIGINS }}
            MCP_URL=${{ vars.MCP_URL }}
          secrets: |-
            OPENAI_API_KEY=cloud-agent-openai-key:latest
          # Capped instances limit OpenAI spend. Runs as a minimal account
          # (reads one secret), builds as another (run.builder only).
          # Making the service public is a one-time step (see README), so the
          # deployer never needs setIamPolicy.
          flags: >-
            --max-instances=2
            --service-account=${{ vars.RUNTIME_SA }}
            --build-service-account=projects/${{ vars.GCP_PROJECT_ID }}/serviceAccounts/${{ vars.BUILD_SA }}

      - run: curl -fsS "${{ steps.deploy.outputs.url }}/api/health"
